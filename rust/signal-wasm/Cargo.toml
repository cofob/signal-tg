[package]
name = "signal-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
libsignal-core = { path = "../libsignal/rust/core" }
libsignal-protocol = { path = "../libsignal/rust/protocol" }
signal-crypto = { path = "../libsignal/rust/crypto" }
zkgroup = { path = "../libsignal/rust/zkgroup" }
usernames = { path = "../libsignal/rust/usernames" }
libsignal-account-keys = { path = "../libsignal/rust/account-keys" }
libsignal-message-backup = { path = "../libsignal/rust/message-backup" }
attest = { path = "../libsignal/rust/attest" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
rand = "0.9"
hkdf = "0.13"
sha2 = "0.11"
uuid = "1.5"
serde = "1"
partial-default = "0.1"
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# WebAssembly backends: `crypto.getRandomValues` for ring and `Date.now` for certificate times
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1", features = ["web"] }

# `getrandom` has no default WebAssembly backend; enable the `crypto.getRandomValues` one for every major version in the tree
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
# `test-util` accepts the old TCB evaluation data of the attestation test vectors that have a known private key
attest = { path = "../libsignal/rust/attest", features = ["test-util"] }
snow = "0.10"

# BoringSSL does not build for wasm32-unknown-unknown: `attest` gets a pure-Rust implementation of the `boring` API it uses
[patch."https://github.com/signalapp/boring"]
boring = { path = "../boring-shim" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.release.package.curve25519-dalek]
opt-level = 3
overflow-checks = false

[profile.release.package.sha2]
opt-level = 3
overflow-checks = false
