# Main nginx configuration of the TeleSignal image. The entrypoint renders `/etc/nginx/templates/*.template` into
# `/tmp/telesignal/nginx` with the environment variables, and this file includes the result. Anything in
# `/etc/nginx/conf.d/*.conf` is included first and replaces the generated server; see docs/DEPLOY.md. The entrypoint
# passes `error_log` (from `NGINX_LOG_LEVEL`) and `daemon off` on the command line.

# Brotli. The package's own `modules/*.conf` loads the files relative to a directory that only the `nginx` user reads
load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

# The container runs as an unprivileged user: no `user` directive, no privileged ports, temporary files under `/tmp`
pid /tmp/nginx/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # The web manifest, which the package's list lacks
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;
    charset utf-8;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server_tokens off;
    # The default log file is in a directory that the unprivileged user cannot write. `NGINX_ACCESS_LOG=on` logs the
    # generated server to the standard output; a server of your own sets `access_log` itself.
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # The build ships `.gz` and `.br` copies of the large files; the rest is compressed on the fly
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json
        application/wasm image/svg+xml image/x-icon;
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_min_length 512;
    brotli_types text/plain text/css text/javascript application/javascript application/json application/manifest+json
        application/wasm image/svg+xml image/x-icon;

    include /etc/nginx/conf.d/*.conf;
    include /tmp/telesignal/nginx/*.conf;
}
