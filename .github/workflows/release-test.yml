# TEMPORARY, not for the default branch: runs `release.yml` for a test tag without pushing a tag from outside. It
# commits the version bump `0.0.0-ci.N` on the runner, pushes only the tag with the workflow token and calls the release
# workflow, then checks the published pre-release. `release-test-cleanup.yml` removes the release and the tag.

name: Release test

on:
  push:
    branches: [ccr-f1d74b45-mht1c2-ci]
    paths: ['.github/workflows/release-test.yml']

permissions:
  contents: read

env:
  NUMBER: '2'

jobs:
  tag:
    name: Create the test tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Bump the version and push the tag
        id: tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node deploy/release.js bump "0.0.0-ci.${NUMBER}"
          git commit -qam "Release 0.0.0-ci.${NUMBER} (workflow test)"
          git tag -a "v0.0.0-ci.${NUMBER}" -m "Workflow test ${NUMBER}"
          git push origin "refs/tags/v0.0.0-ci.${NUMBER}"
          echo "tag=v0.0.0-ci.${NUMBER}" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: tag
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  verify:
    name: Verify the release
    needs: [tag, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Check the release
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,url,assets \
            --jq '"tag=\(.tagName) name=\(.name) draft=\(.isDraft) prerelease=\(.isPrerelease) \(.url)", (.assets[] | "  \(.name)  \(.size) bytes")'
          [[ "$(gh release view "$TAG" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @csv')" == 'false,true' ]]
          echo "Latest release: $(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>&1 || true)"
          echo '--- notes'
          gh release view "$TAG" --json body --jq .body | head -12
