# Builds the TeleSignal desktop app (`tauri/`) for macOS, Windows and Linux and uploads the packages as workflow
# artifacts. A `v*` tag also attaches them to a draft GitHub release. Code signing, notarization and the updater stay
# off unless their secrets and variables exist; see `tauri/README.md`.

name: Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      # Only tag builds write: they attach the packages to the draft release
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifacts: |
              tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - name: macOS x64
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifacts: |
              tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifacts: |
              tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe*
          - name: Linux x64
            # The oldest supported runner, so the AppImage runs on older glibc versions
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifacts: |
              tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage*
    runs-on: ${{ matrix.runner }}
    env:
      # GramJS still reads these at build time until plan stage 3 removes it; the app never connects to Telegram
      TELEGRAM_API_ID: '1'
      TELEGRAM_API_HASH: unused
      # Optional configuration, see `tauri/README.md`
      UPDATER_ENDPOINT: ${{ vars.UPDATER_ENDPOINT }}
      UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
      HAS_UPDATER_KEY: ${{ secrets.UPDATER_PRIVATE_KEY != '' }}
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.SM_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      # Signing secrets reach the build only when they exist, so unsigned builds do not get empty values
      - name: Enable macOS signing
        if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              echo "::add-mask::${!name}"
              echo "$name=${!name}" >> "$GITHUB_ENV"
            fi
          done

      - name: Enable Windows signing
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: bash
        run: |
          echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/Certificate_pkcs12.p12
          echo "SM_HOST=${{ secrets.SM_HOST }}" >> "$GITHUB_ENV"
          echo "SM_API_KEY=${{ secrets.SM_API_KEY }}" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_FILE=D:\\Certificate_pkcs12.p12" >> "$GITHUB_ENV"
          echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEYPAIR_ALIAS=${{ secrets.KEYPAIR_ALIAS }}" >> "$GITHUB_ENV"

      - name: Install DigiCert client tools
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        uses: digicert/code-signing-software-trust-action@v1.2.1
        with:
          simple-signing-mode: true

      - name: Enable updater signing
        if: env.HAS_UPDATER_KEY == 'true' && env.UPDATER_ENDPOINT != '' && env.UPDATER_PUBLIC_KEY != ''
        shell: bash
        run: |
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<EOF"
            echo "${{ secrets.UPDATER_PRIVATE_KEY }}"
            echo "EOF"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.UPDATER_PRIVATE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Define configuration overrides
        shell: bash
        run: node deploy/prepareTauriConfig.js > tauri/tauri.ci.conf.json

      - name: Build and package
        id: build
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config tauri/tauri.ci.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: TeleSignal ${{ github.ref_name }}
          releaseDraft: true

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TeleSignal-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
