# Audits the dependencies against the advisory databases every week and whenever a lockfile changes.

name: Security

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'package-lock.json'
      - '**/Cargo.lock'
      - '.github/workflows/security.yml'

permissions:
  contents: read

jobs:
  npm:
    name: Audit npm packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Development tools never reach users, so only the packages in the bundle can fail the job
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

  cargo:
    name: Audit crates (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [proxy, tauri, rust/signal-wasm]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-audit

      - name: Audit
        run: cargo audit --file ${{ matrix.directory }}/Cargo.lock
