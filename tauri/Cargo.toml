 [package]
name = "telesignal"
# The app version comes from `package.json` through `tauri.conf.json`
version = "0.0.0"
description = "TeleSignal"
authors = ["Alexander Zinchuk", "TeleSignal contributors"]
license = "GPLv3"
edition = "2024"
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.2", features = [ "unstable", "config-json5", "tray-icon", "image-png"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-shell = "2.4.1"
tauri-plugin-log = "2.10.0"
tauri-plugin-notification = "2.5.1"
# Already in the tree through the notification plugin, which drops the handle that reports a click
notify-rust = "4.18.2"
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-fs = "2.6.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-deep-link = "2.6.1"
log = "0.4.34"
uuid = { version = "1.27.0", features = ["v4"] }
url = "2.5.8"
image      = "0.25.10"
imageproc  = "0.27.0"
ab_glyph   = "0.2.32"
tauri-plugin-os = "2.4.0"
# The tunnel's policy and relay, without its WebSocket server
telesignal-tunnel = { path = "../proxy", default-features = false }
# Already in the tree through `tauri` and the tunnel; the relay takes a `futures` `Stream` and `Sink`
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }
tauri-plugin-autostart = "2.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.27.0"
objc = "0.2.7"
rand = "0.10.3"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
